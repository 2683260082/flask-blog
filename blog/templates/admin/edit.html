{% extends "base.html" %}

{% block title %}{{ '编辑文章' if post else '新建文章' }} · 墨刊后台{% endblock %}

{% block content %}
<div class="admin-bar">
  <h1>{{ '编辑文章' if post else '新建文章' }}</h1>
  <a class="btn" href="{{ url_for('admin.dashboard') }}">← 返回列表</a>
</div>

<form method="post" class="form-grid" style="padding-bottom:4rem">
  <div class="form-row">
    <label for="title-input">标题</label>
    <input type="text" id="title-input" name="title" required maxlength="120"
           placeholder="给文章起个标题"
           value="{{ post.title if post else '' }}">
  </div>

  <div class="form-row inline">
    <div class="form-row">
      <label for="tags-input">标签（逗号分隔）</label>
      <input type="text" id="tags-input" name="tags" maxlength="100"
             placeholder="Flask, 随笔"
             value="{{ post.tags.strip(',').replace(',', ', ') if post else '' }}">
    </div>
    <div class="form-row">
      <label for="status-input">状态</label>
      <select id="status-input" name="status">
        <option value="draft"{{ ' selected' if not post or post.status == 'draft' else '' }}>草稿</option>
        <option value="published"{{ ' selected' if post and post.status == 'published' else '' }}>发布</option>
      </select>
    </div>
  </div>

  <div class="form-row">
    <label for="summary-input">摘要（列表页展示，可留空）</label>
    <input type="text" id="summary-input" name="summary" maxlength="200"
           placeholder="一句话说明这篇文章"
           value="{{ post.summary if post else '' }}">
  </div>

  <div class="form-row">
    <label for="content-input">正文（支持 Markdown）</label>
    <textarea id="content-input" name="content" required
              placeholder="## 小标题&#10;&#10;正文内容……">{{ post.content if post else '' }}</textarea>
  </div>

  <div class="form-actions">
    <button class="btn btn-primary" type="submit">保存</button>
    <a class="btn" href="{{ url_for('admin.dashboard') }}">取消</a>
    {% if post and post.status == 'published' %}
      <a class="btn" href="{{ url_for('front.post_detail', post_id=post.id) }}">在前台查看 →</a>
    {% endif %}
  </div>
</form>
{% endblock %}
